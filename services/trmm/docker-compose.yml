# Tactical RMM — full stack
# Adapted from https://github.com/amidaware/tacticalrmm/tree/develop/docker
# Verify image tags against the official compose before deploying a new version.
#
# Network layout:
#   trmm-nginx  → proxy-net  (NPM Plus forwards rmm/api/mesh subdomains here)
#   trmm-nginx  → trmm-net   (routes internally to backend, websockets, meshcentral)
#   All other services → trmm-net only (no path to Zammad or proxy-net)
#
# NATS (port 4222): agents connect outbound from client sites over TLS.
#   Requires NSG/firewall inbound rule for TCP 4222 on the VM.
#   See CLAUDE.md: "Tactical RMM" → NPM Plus proxy host table.
#
# First-run init:
#   docker compose -f /opt/trmm/docker-compose.yml run --rm tactical-init
#   Then: docker compose -f /opt/trmm/docker-compose.yml up -d
#   Or just use: sudo bash /opt/scripts/trmm-setup.sh (handles both steps)

services:

  # ── One-shot initialisation ───────────────────────────────────────────────────
  tactical-init:
    image: amidaware/tactical:${TRMM_VERSION:-latest}
    container_name: trmm-init
    command: ["/bin/bash", "/home/tactical/docker/init.sh"]
    env_file: .env
    volumes:
      - trmm-data:/home/tactical
    networks:
      - trmm-net
    depends_on:
      - tactical-postgres
      - tactical-redis
    restart: "no"

  # ── Application services ──────────────────────────────────────────────────────
  tactical-backend:
    image: amidaware/tactical:${TRMM_VERSION:-latest}
    container_name: trmm-backend
    command: ["/bin/bash", "/home/tactical/docker/entrypoints/backend.sh"]
    env_file: .env
    volumes:
      - trmm-data:/home/tactical
    networks:
      - trmm-net
    restart: unless-stopped
    depends_on:
      - tactical-postgres
      - tactical-redis

  tactical-celery:
    image: amidaware/tactical:${TRMM_VERSION:-latest}
    container_name: trmm-celery
    command: ["/bin/bash", "/home/tactical/docker/entrypoints/celery.sh"]
    env_file: .env
    volumes:
      - trmm-data:/home/tactical
    networks:
      - trmm-net
    restart: unless-stopped
    depends_on:
      - tactical-postgres
      - tactical-redis

  tactical-celery-beat:
    image: amidaware/tactical:${TRMM_VERSION:-latest}
    container_name: trmm-celery-beat
    command: ["/bin/bash", "/home/tactical/docker/entrypoints/celery-beat.sh"]
    env_file: .env
    volumes:
      - trmm-data:/home/tactical
    networks:
      - trmm-net
    restart: unless-stopped
    depends_on:
      - tactical-postgres
      - tactical-redis

  tactical-websockets:
    image: amidaware/tactical:${TRMM_VERSION:-latest}
    container_name: trmm-websockets
    command: ["/bin/bash", "/home/tactical/docker/entrypoints/websockets.sh"]
    env_file: .env
    volumes:
      - trmm-data:/home/tactical
    networks:
      - trmm-net
    restart: unless-stopped
    depends_on:
      - tactical-postgres
      - tactical-redis

  # ── Infrastructure ────────────────────────────────────────────────────────────
  tactical-postgres:
    image: postgres:15-alpine
    container_name: trmm-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-tactical}
      POSTGRES_PASSWORD: ${POSTGRES_PASS}
      POSTGRES_DB: ${POSTGRES_DB:-tacticalrmm}
    volumes:
      - trmm-postgres-data:/var/lib/postgresql/data
    networks:
      - trmm-net

  tactical-redis:
    image: redis:7-alpine
    container_name: trmm-redis
    restart: unless-stopped
    networks:
      - trmm-net

  # ── MeshCentral (in-browser remote desktop) ───────────────────────────────────
  tactical-meshcentral:
    image: amidaware/tactical-meshcentral:${TRMM_VERSION:-latest}
    container_name: trmm-meshcentral
    env_file: .env
    volumes:
      - trmm-data:/home/tactical
      - trmm-mesh-data:/home/meshcentral
    networks:
      - trmm-net
    restart: unless-stopped

  # ── NATS (agent messaging — TCP/TLS, NOT through NPM Plus) ────────────────────
  # Agents connect to api.yourdomain.com:4222.
  # Port 4222 must be open inbound on the Azure NSG and host firewall.
  tactical-nats:
    image: nats:2-alpine
    container_name: trmm-nats
    command: ["nats-server", "-c", "/home/tactical/docker/nats/nats.conf"]
    ports:
      - "4222:4222"
    volumes:
      - trmm-data:/home/tactical
    networks:
      - trmm-net
    restart: unless-stopped
    depends_on:
      - tactical-init

  # ── Nginx (subdomain router — bridges proxy-net and trmm-net) ─────────────────
  # NPM Plus forwards all three subdomains here; this nginx routes by Host header.
  # It is the only TRMM container visible on proxy-net.
  tactical-nginx:
    image: nginx:1.25-alpine
    container_name: trmm-nginx
    volumes:
      - trmm-data:/home/tactical
      - trmm-nginx-conf:/etc/nginx/conf.d:ro
    networks:
      - proxy-net
      - trmm-net
    restart: unless-stopped
    depends_on:
      - tactical-backend
      - tactical-websockets
      - tactical-meshcentral

volumes:
  trmm-data:
  trmm-postgres-data:
  trmm-mesh-data:
  trmm-nginx-conf:

networks:
  proxy-net:
    external: true
  trmm-net:
    external: true
