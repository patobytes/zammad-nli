# GlobaLeaks tenant template
#
# Do NOT deploy this file directly. Use scripts/globaleaks-add-tenant.sh which
# generates a per-tenant copy at /opt/globaleaks-<tenant>/docker-compose.yml.
#
# Each tenant gets:
#   - An isolated Docker network: gl-<tenant>-net (172.21.<n>.0/24)
#   - A container: globaleaks-<tenant>
#   - A named volume: gl-<tenant>-data
#   - NPM Plus hot-connected to its network (no npm restart needed)
#
# Tenants are fully isolated — they share no network with each other,
# with Zammad, or with proxy-net.

services:
  globaleaks-TENANT:
    image: globaleaks/globaleaks:latest
    container_name: globaleaks-TENANT
    restart: unless-stopped
    volumes:
      - gl-TENANT-data:/var/globaleaks
    networks:
      - gl-TENANT-net

volumes:
  gl-TENANT-data:

networks:
  gl-TENANT-net:
    external: true
